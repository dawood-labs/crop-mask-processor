# FAO crop-mask pipeline - production configuration
#
# Run:  cropmask -c config/default.yaml
# Test: cropmask -c config/default.yaml --limit 5

# ---- data -------------------------------------------------------------
input_uri:    "gs://farmdar_data_catalog/fao/crop_processing/2025"
output_uri:   "gs://farmdar_data_catalog/fao/crop_processing/output/2025"
boundary_uri: "gs://farmdar_data_catalog/fao/crop_processing/boundary/District-AOI-Boundary-From-FAO.shp"
boundary_field: "districts"

# Service-account key. Leave null to fall back to GOOGLE_APPLICATION_CREDENTIALS
# or the instance's attached service account.
credentials_json: null

# ---- processing -------------------------------------------------------
metric_crs: "EPSG:32642"     # UTM 42N - all geometry ops and area maths
output_crs: "EPSG:4326"      # shapefiles are written in lat/lon
min_polygon_acres: 0.5       # polygons at or below this are dropped
min_total_acres: 200.0       # a crop layer at or below this is dropped entirely

# ---- scaling ----------------------------------------------------------
# workers: null = size the pool from the CPU count and free RAM at runtime.
workers: null
memory_fraction: 0.70        # share of *available* RAM the run may claim
memory_per_input_byte: 8.0   # RAM per input byte on top of a ~400 MB worker baseline
min_worker_memory: 2147483648
cpu_oversubscribe: 1.25      # pool size = CPUs x this; RAM budget still governs
adaptive_memory: true        # re-estimate from measured peak RSS during the run
max_tasks_per_child: 4       # recycle workers to hand memory back to the OS
transfer_threads: 8

# ---- behaviour --------------------------------------------------------
keep_intermediates: false    # true writes the QA layers (~10x the output size)
only_provinces: []
only_districts: []
limit: 0
work_dir: "/tmp/cropmask"
report_name: "acreage_report.xlsx"
district_timeout: 5400
log_level: "INFO"
